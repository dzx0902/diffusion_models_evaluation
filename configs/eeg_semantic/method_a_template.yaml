experiment:
  name: method_a_template_chentianlin_fold1_seed42
  method: coarse_template
  seed: 42
  output_dir: outputs/eeg_semantic/method_a_template/chentianlin/fold1/seed42

data:
  trials: data/manifests/eeg_trials.csv
  semantic_labels: outputs/semantic_labels/eeg_semantic_labels_v1.jsonl
  split_plan: outputs/eeg_wan/splits/chentianlin_video_6fold_plan.json
  fold: video_6fold_1
  sessions: [session1, session2, session3]

model:
  channels: 62
  sample_points: 800
  sampling_rate: 200
  hidden_dim: 256
  token_count: 75
  encoder_layers: 2
  heads: 8
  dropout: 0.15
  architecture: baseline

semantic:
  slots: [subject, object, coarse_action]
  threshold_search: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8]
  min_frequency:
    subject: 1
    object: 1
    coarse_action: 1
  thresholds:
    subject: 0.5
    object: 0.5
    coarse_action: 0.5

loss:
  slot_weights:
    subject: 1.0
    object: 1.0
    coarse_action: 1.0
  session_consistency: 0.1

training:
  epochs: 80
  batch_size: 24
  workers: 0
  group_sessions: true
  learning_rate: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
