experiment:
  name: method_c_autoencoder512_tora_chentianlin_fold1_seed42
  method: tora_autoencoder
  seed: 42
  output_dir: outputs/eeg_semantic/method_c_autoencoder512_tora/chentianlin/fold1/seed42

data:
  trials: data/manifests/chentianlin/eeg_trials.csv
  semantic_labels: outputs/semantic_labels/eeg_semantic_labels_v1.jsonl
  split_plan: outputs/eeg_wan/splits/chentianlin_video_6fold_plan.json
  fold: video_6fold_1
  tora_target_index: outputs/tora/autoencoder/fold1/dim512/index.jsonl
  autoencoder_checkpoint: outputs/tora/autoencoder/fold1/dim512/best.pt
  sessions: [session1, session2, session3]

model:
  implementation: eeg2caption_compact
  channels: 62
  sample_points: 800
  sampling_rate: 200
  eeg_scale: 1000000.0
  temporal_filters: 16
  spatial_multiplier: 2
  feature_dim: 128
  decoder_layers: 2
  decoder_heads: 8
  dropout: 0.35
  condition_slots: 226
  condition_dim: 512
  target_centering: true

loss:
  mse: 1.0
  cosine: 0.2
  contrastive: 0.2
  auxiliary_classification: 0.1
  session_consistency: 0.1
  prototype: 0.05

contrastive:
  temperature: 0.07
  semantic_temperature: 0.07
  mode: soft_semantic

augmentation:
  noise_std: 0.02
  time_mask_samples: 20

training:
  epochs: 100
  batch_size: 24
  workers: 0
  group_sessions: true
  learning_rate: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
  gradient_accumulation_steps: 1
  amp: true
